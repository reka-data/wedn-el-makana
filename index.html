let currentSession=null,recording=false,freqData=[],loudData=[],audioCtx,analyser,micStream;
function newSessionId(){return 'WDN-'+Date.now().toString().slice(-6)+'-'+Math.floor(Math.random()*100)}
function clearDiagnosis(){currentSession=null;freqData=[];loudData=[];document.getElementById('resCard').style.display='none';document.getElementById('placeCard').style.display='block';let d=TR[document.documentElement.lang]||TR.ar;document.getElementById('status').innerText=d.btn_mic;document.getElementById('micBtn').disabled=false}
async function startListen(){if(recording)return;clearDiagnosis();currentSession=newSessionId();let sid=currentSession;try{micStream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){alert('Mic permission needed');currentSession=null;return}recording=true;let btn=document.getElementById('micBtn');btn.disabled=true;btn.classList.add('rec');document.getElementById('wave').classList.add('active');document.getElementById('status').innerText='🔴 ... '+sid;audioCtx=new (window.AudioContext||window.webkitAudioContext)();let src=audioCtx.createMediaStreamSource(micStream);analyser=audioCtx.createAnalyser();analyser.fftSize=2048;src.connect(analyser);let data=new Uint8Array(analyser.frequencyBinCount);freqData=[];loudData=[];let it=setInterval(()=>{if(currentSession!==sid){clearInterval(it);return}analyser.getByteFrequencyData(data);let max=0,mi=0,sum=0;for(let i=0;i<data.length;i++){sum+=data[i];if(data[i]>max){max=data[i];mi=i}}freqData.push(Math.round(mi*audioCtx.sampleRate/analyser.fftSize));loudData.push(sum/data.length)},100);setTimeout(()=>{clearInterval(it);if(currentSession!==sid)return;recording=false;btn.disabled=false;btn.classList.remove('rec');document.getElementById('wave').classList.remove('active');micStream.getTracks().forEach(t=>t.stop());diagnose(sid)},3000)}

function showSample(id){
  let s=SOUNDS.find(x=>x.id===id);
  let audio=document.getElementById('samplePlayer');
  audio.style.display='block'; audio.src=s.file; audio.play();
  // عرض النتيجة كاملة بنفس شكل التشخيص
  let now=new Date(); let sid=newSessionId();
  document.getElementById('resCard').style.display='block'; document.getElementById('placeCard').style.display='none';
  document.getElementById('sessionId').innerText='WDN '+sid;
  document.getElementById('rDanger').className='danger '+s.cls; document.getElementById('rDanger').innerText=s.danger;
  let fill=document.getElementById('rDangerFill'); fill.style.width=s.percent+'%'; fill.style.background=s.color; fill.innerText=s.percent+'%';
  document.getElementById('rMachine').innerText=selected.name;
  document.getElementById('rDate').innerText=now.toLocaleString()+' - '+sid;
  document.getElementById('rFault').innerText=s.name+' - '+s.enName;
  document.getElementById('rCause').innerText=s.cause;
  document.getElementById('rPercent').innerText=s.percent+'%';
  document.getElementById('rFreq').innerText=s.freq[0]+'-'+s.freq[1]+' Hz';
  document.getElementById('rSteps').innerHTML=s.steps.map(x=>`<div class="step">✔️ ${x}</div>`).join('');
  document.getElementById('rTime').innerText=s.time; document.getElementById('rPart').innerText=s.part;
  document.getElementById('status').innerText='✅ '+sid;
  window.lastRes=s; window.lastSid=sid; window.lastDate=now;
  document.getElementById('resCard').scrollIntoView({behavior:'smooth'});
}

  let fill=document.getElementById('rDangerFill'); fill.style.width=best.percent+'%'; fill.style.background=best.color; fill.innerText=best.percent+'%';
  document.getElementById('rMachine').innerText=selected.name;
  document.getElementById('rDate').innerText=now.toLocaleString()+' - '+sid;
  document.getElementById('rFault').innerText=best.name+' - '+best.enName;
  document.getElementById('rCause').innerText=best.cause;
  document.getElementById('rPercent').innerText=best.percent+'%';
  document.getElementById('rFreq').innerText=avgFreq+' Hz';
  document.getElementById('rSteps').innerHTML=best.steps.map(s=>`<div class="step">✔️ ${s}</div>`).join('');
  document.getElementById('rTime').innerText=best.time; document.getElementById('rPart').innerText=best.part;
  document.getElementById('status').innerText='✅ '+sid;
  window.lastRes=best; window.lastSid=sid; window.lastDate=now;
}

function diagnose(sid){
  if(currentSession!==sid)return;
  let avgLoud=loudData.reduce((a,b)=>a+b,0)/Math.max(1,loudData.length);
  let d=TR[document.documentElement.lang]||TR.ar;
  if(avgLoud<3){ document.getElementById('status').innerText=d.no_sound; alert(d.no_sound_alert); currentSession=null; return; }
  let avgFreq=Math.round(freqData.reduce((a,b)=>a+b,0)/Math.max(1,freqData.length));let variance=Math.max(...freqData)-Math.min(...freqData);let avgVol=Math.round(avgLoud);let best=null,bestScore=9999;SOUNDS.forEach(s=>{let mid=(s.freq[0]+s.freq[1])/2;let score=Math.abs(avgFreq-mid)/500+Math.abs(avgVol-s.loud)/20+Math.abs(variance-s.var)/800;if(score<bestScore){bestScore=score;best=s}});if(bestScore>6){alert(d.faq2_a);currentSession=null;return}
  showResultFromSound(best,avgFreq,sid);
}
function saveHistory(){if(!window.lastRes)return;let list=document.getElementById('historyList');let d=TR[document.documentElement.lang]||TR.ar;if(list.innerText.includes(d.hist_empty)||list.innerText.includes('No faults')||list.innerText.includes('لسه'))list.innerHTML='';let div=document.createElement('div');div.style.cssText='background:#f1f5f9;padding:10px;border-radius:10px;margin-top:8px';div.innerHTML=`<b>${selected.name}</b> - ${window.lastRes.name} <span>${window.lastSid}</span><br><small>${window.lastDate.toLocaleString()} | ${window.lastRes.danger} | خطورة ${window.lastRes.percent}%</small>`;list.prepend(div);setTimeout(()=>{clearDiagnosis();window.lastRes=null},500)}
</script>
